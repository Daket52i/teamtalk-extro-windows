name: TeamTalk Extro Windows

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  EXTRO_VERSION: "5.33.0"
  QT_VERSION: "6.12.0"

jobs:
  build:
    name: Build Windows client
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: 'qtmultimedia qtspeech'
          setup-python: false
          aqtsource: 'aqtinstall@git+https://github.com/miurahr/aqtinstall.git@master'

      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          path-type: inherit
          update: true
          release: false
          install: base-devel

      - name: Install NASM
        working-directory: ${{runner.workspace}}
        shell: cmd
        run: |
          curl -L -o nasm.zip https://www.nasm.us/pub/nasm/releasebuilds/3.01/win64/nasm-3.01-win64.zip
          7z x nasm.zip
          echo %CD%\nasm-3.01>> %GITHUB_PATH%

      - name: Configure CMake
        working-directory: ${{runner.workspace}}
        run: >-
          cmake -S ${{github.workspace}} -B output -A x64
          -DBUILD_TEAMTALK_LIBRARY_UNITTEST_CATCH2=OFF
          -DFEATURE_WEBRTC=OFF
          -DBUILD_TEAMTALK_SERVERS=OFF
          -DBUILD_TEAMTALK_DOCUMENTATION=OFF
          -DBUILD_TEAMTALK_LIBRARIES=OFF
          -DBUILD_TEAMTALK_CLIENT_NET=OFF
          -DBUILD_TEAMTALK_CLIENT_JAVA=OFF
          -DTOOLCHAIN_INSTALL_PREFIX=${{runner.workspace}}/install-toolchain
          -DCMAKE_INSTALL_PREFIX=${{runner.workspace}}/install-teamtalk

      - name: Build and install
        working-directory: ${{runner.workspace}}
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          set "PATH=C:\msys64\usr\bin;%PATH%"
          cmake --build output --parallel --config Release --target install

      - name: Assemble portable folder
        shell: pwsh
        run: |
          $pkg = Join-Path $env:RUNNER_WORKSPACE "dist\TeamTalkExtro"
          $inst = Join-Path $env:RUNNER_WORKSPACE "install-teamtalk"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null

          Copy-Item (Join-Path $inst "Client\qtTeamTalk\*") $pkg -Recurse -Force
          Copy-Item (Join-Path $inst "Library\TeamTalk_DLL\TeamTalk5.dll") $pkg -Force
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "Setup\Client\Windows\TeamTalk5.ini") (Join-Path $pkg "TeamTalkExtro.ini.default") -Force
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "Setup\Client\Windows\TeamTalk5.ini") (Join-Path $pkg "TeamTalk Extro.ini.default") -Force
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "Setup\Client\Sounds") (Join-Path $pkg "Sounds") -Recurse -Force

          # Ensure compiled Qt translation (.qm) files are bundled in languages\
          $langDst = Join-Path $pkg "languages"
          New-Item -ItemType Directory -Force -Path $langDst | Out-Null
          $langSrcCandidates = @(
              (Join-Path $inst "Client\qtTeamTalk\languages\*.qm"),
              (Join-Path $env:GITHUB_WORKSPACE "Client\qtTeamTalk\languages\*.qm")
          )
          foreach ($pattern in $langSrcCandidates) {
              if (Test-Path $pattern) {
                  Copy-Item $pattern $langDst -Force
              }
          }

          if (Test-Path (Join-Path $pkg "windeployqt")) {
              Copy-Item (Join-Path $pkg "windeployqt\*") $pkg -Recurse -Force
              Remove-Item (Join-Path $pkg "windeployqt") -Recurse -Force
          }

          # Write qt.conf so Qt always locates platforms/qwindows.dll and plugins relative to exe dir
          "[Paths]`r`nPrefix=.`r`nPlugins=." | Set-Content -Path (Join-Path $pkg "qt.conf") -Encoding Ascii

          # Bundle app-local MSVC x64 CRT DLLs so TeamTalkExtro runs even without VC++ Redist
          $crtDirs = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\*\VC\Redist\MSVC" -Recurse -Directory -Filter "Microsoft.VC143.CRT" -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\x64\\Microsoft\.VC143\.CRT$' } |
              Sort-Object FullName -Descending
          foreach ($crt in $crtDirs) {
              Copy-Item (Join-Path $crt.FullName "*.dll") $pkg -Force
              Write-Host "Copied MSVC x64 CRT DLLs from $($crt.FullName)"
              break
          }

          if (-not (Test-Path (Join-Path $pkg "TeamTalkExtro.exe"))) { throw "TeamTalkExtro.exe missing from package" }
          if (-not (Test-Path (Join-Path $pkg "TeamTalk5.dll"))) { throw "TeamTalk5.dll missing from package" }
          Get-ChildItem $pkg | Format-Table Name, Length

      - name: Version and portable zip
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.TrimStart('v') } else { $env:EXTRO_VERSION }
          "EXTRO_RELEASE_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $dist = Join-Path $env:RUNNER_WORKSPACE "dist"
          Compress-Archive -Path (Join-Path $dist "TeamTalkExtro\*") -DestinationPath (Join-Path $dist "TeamTalkExtro-$ver-win64-portable.zip") -Force

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $src = Join-Path $env:RUNNER_WORKSPACE "dist\TeamTalkExtro"
          & $iscc "/DExtroVersion=$env:EXTRO_RELEASE_VERSION" "/DSrcDir=$src" "$env:GITHUB_WORKSPACE\Setup\Extro\TeamTalkExtro.iss"
          Copy-Item "$env:GITHUB_WORKSPACE\Setup\Extro\Output\*.exe" (Join-Path $env:RUNNER_WORKSPACE "dist") -Force

      - name: Archive source
        shell: pwsh
        run: |
          git archive --format=zip --output="$env:RUNNER_WORKSPACE\dist\TeamTalkExtro-$env:EXTRO_RELEASE_VERSION-source.zip" HEAD

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TeamTalkExtro-Windows
          path: |
            ${{runner.workspace}}/dist/TeamTalkExtro-*-win64-portable.zip
            ${{runner.workspace}}/dist/TeamTalkExtro-*-win64-setup.exe
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.EXTRO_VERSION) }}
          name: TeamTalk Extro ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.EXTRO_VERSION) }}
          body: |
            ## TeamTalk Extro Windows ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.EXTRO_VERSION) }} — Новые возможности и исправления

            ### 📦 Файлы релиза
            - `TeamTalkExtro-*-win64-setup.exe` — установщик Inno Setup для Windows x64 (с автоустановкой VC++ Redistributable, ассоциацией `.tt` и протокола `tt://`).
            - `TeamTalkExtro-*-win64-portable.zip` — портативная версия (распаковать в любую папку и запустить `TeamTalkExtro.exe`).

            ### 🇷🇺 100% чистая и полная русская локализация
            - Переведены **все** меню, подменю, диалоги, подсказки, статусы и сообщения TeamTalk Extro (Голос, Караоке, Soundboard, Щит безопасности, Server Peek, Бэкап, О программе).
            - Исправлена динамическая перерисовка всех меню Extro при загрузке `ru.qm` и переключении языка (`QEvent::LanguageChange`).
            - Автоматический выбор русского языка при первом запуске на русскоязычной Windows.

            ### 🛡️ Щит безопасности (Extro Shield) и зашифрованный бэкап (AES-256-GCM)
            - **🔐 Кроссплатформенный зашифрованный бэкап (JSON v2)**: при экспорте можно задать пароль (PBKDF2-HMAC-SHA256 100 000 итераций + AES-256-GCM через Windows CNG), на 100% совместимый с **TeamTalk Extro для Android**. Автоопределение зашифрованного бэкапа при импорте, перенос заметок о пользователях и настроек Щита.
            - **Фильтр опасных ссылок (Safe Link Guard)**: предупреждения о фишинге, IP-логгерах (`grabify`, `iplogger`, `2no.co`, `yip.su`, `blasze`, `ps3cfw`), punycode-омографах (`xn--`), прямых ссылках на `.exe/.bat/.msi/.apk`, сокращателях ссылок и прямых IP-ссылках.
            - **Анти-флуд и Анти-Zalgo / Unicode-защита**: нейтрализация спуфинга имён файлов (`U+202E` RLO) и Zalgo-спама (>6 диакритических знаков подряд), локальное подавление флуд-атак (>6 сообщений за 3 секунды).
            - **🚨 Экстренная кнопка приватности «Паника / Panic Mute» (`Ctrl+Shift+M`)**: мгновенно выключает микрофон, VOX, Voice Changer, Караоке/WASAPI Loopback, Soundboard, видео и демонстрацию экрана с голосовым оповещением.
            - **🔒 Индикатор шифрования TLS в строке состояния** (`TLS` / `Без TLS`) и предупреждение о незашифрованном подключении.
            - **📜 Журнал безопасности**: последние 200 событий безопасности с копированием, экспортом и очисткой.

            ### 🎛️ Творческие и доступные функции (NVDA / JAWS)
            - **Быстрые студийные сцены (1 клик)**: «Обычное общение», «Радио-ведущий / Диджей», «Караоке-сцена», «Поп-Автотюн», «Ночной пранк».
            - **📝 Локальные заметки о пользователях**: контекстное меню пользователя в дереве каналов + менеджер заметок (отображаются в дереве и озвучиваются скринридерами, сохраняются в бэкапе).
            - **⏱️ Таймер сна (15 / 30 / 60 / 90 мин)**: обратный отсчёт в строке состояния, плавная остановка караоке/саундборда и отключение от сервера.
            - **🗣️ «Кто сейчас говорит?» (`Ctrl+Shift+W`)**: мгновенное озвучивание активных говорящих в текущем канале для NVDA/JAWS.

            ### 🌐 Надёжный Server Peek («Кто на сервере без входа в канал»)
            - Мгновенный просмотр (0 мс) без второго подключения, если клиент уже подключён к этому серверу.
            - Поддержка TLS-серверов, таймаут до 12 секунд, ожидание завершения команды `TT_DoLoginEx` и слияние нативных снимков `TT_GetServerChannels` / `TT_GetServerUsers`, точная диагностика этапа и кода ошибки.

            ### 🎭 Голосовые эффекты Pro (24 режима) и 🎤 Караоке Pro + WASAPI Loopback
            - 24 режима (Auto-Tune Pop/Hard, Studio Voice Rack, Broadcast DJ, Concert Hall и др.), захват системного звука/браузера без VB-Cable, Auto-Ducking, смена тональности (±6 полутонов), Soundboard (`Ctrl+Alt+1..6`).

            ---
            *Благодарности (Credits): основано на [BearWare/TeamTalk5](https://github.com/BearWare/TeamTalk5) и [nekit-wq/Teamtalk-next](https://github.com/nekit-wq/Teamtalk-next).*
          files: |
            ${{runner.workspace}}/dist/TeamTalkExtro-*-win64-portable.zip
            ${{runner.workspace}}/dist/TeamTalkExtro-*-win64-setup.exe
            ${{runner.workspace}}/dist/TeamTalkExtro-*-source.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: TeamTalk Extro Windows

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  EXTRO_VERSION: "5.31.0"
  QT_VERSION: "6.12.0"

jobs:
  build:
    name: Build Windows client
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: 'qtmultimedia qtspeech'
          setup-python: false
          aqtsource: 'aqtinstall@git+https://github.com/miurahr/aqtinstall.git@master'

      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          path-type: inherit
          update: true
          release: false
          install: base-devel

      - name: Install NASM
        working-directory: ${{runner.workspace}}
        shell: cmd
        run: |
          curl -L -o nasm.zip https://www.nasm.us/pub/nasm/releasebuilds/3.01/win64/nasm-3.01-win64.zip
          7z x nasm.zip
          echo %CD%\nasm-3.01>> %GITHUB_PATH%

      - name: Configure CMake
        working-directory: ${{runner.workspace}}
        run: >-
          cmake -S ${{github.workspace}} -B output -A x64
          -DBUILD_TEAMTALK_LIBRARY_UNITTEST_CATCH2=OFF
          -DFEATURE_WEBRTC=OFF
          -DBUILD_TEAMTALK_SERVERS=OFF
          -DBUILD_TEAMTALK_DOCUMENTATION=OFF
          -DBUILD_TEAMTALK_LIBRARIES=OFF
          -DBUILD_TEAMTALK_CLIENT_NET=OFF
          -DBUILD_TEAMTALK_CLIENT_JAVA=OFF
          -DTOOLCHAIN_INSTALL_PREFIX=${{runner.workspace}}/install-toolchain
          -DCMAKE_INSTALL_PREFIX=${{runner.workspace}}/install-teamtalk

      - name: Build and install
        working-directory: ${{runner.workspace}}
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          set "PATH=C:\msys64\usr\bin;%PATH%"
          cmake --build output --parallel --config Release --target install

      - name: Assemble portable folder
        shell: pwsh
        run: |
          $pkg = Join-Path $env:RUNNER_WORKSPACE "dist\TeamTalkExtro"
          $inst = Join-Path $env:RUNNER_WORKSPACE "install-teamtalk"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null

          Copy-Item (Join-Path $inst "Client\qtTeamTalk\*") $pkg -Recurse -Force
          Copy-Item (Join-Path $inst "Library\TeamTalk_DLL\TeamTalk5.dll") $pkg -Force
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "Setup\Client\Windows\TeamTalk5.ini") (Join-Path $pkg "TeamTalkExtro.ini.default") -Force
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "Setup\Client\Windows\TeamTalk5.ini") (Join-Path $pkg "TeamTalk Extro.ini.default") -Force
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "Setup\Client\Sounds") (Join-Path $pkg "Sounds") -Recurse -Force

          # Ensure compiled Qt translation (.qm) files are bundled in languages\
          $langDst = Join-Path $pkg "languages"
          New-Item -ItemType Directory -Force -Path $langDst | Out-Null
          $langSrcCandidates = @(
              (Join-Path $inst "Client\qtTeamTalk\languages\*.qm"),
              (Join-Path $env:GITHUB_WORKSPACE "Client\qtTeamTalk\languages\*.qm")
          )
          foreach ($pattern in $langSrcCandidates) {
              if (Test-Path $pattern) {
                  Copy-Item $pattern $langDst -Force
              }
          }

          if (Test-Path (Join-Path $pkg "windeployqt")) {
              Copy-Item (Join-Path $pkg "windeployqt\*") $pkg -Recurse -Force
              Remove-Item (Join-Path $pkg "windeployqt") -Recurse -Force
          }

          # Write qt.conf so Qt always locates platforms/qwindows.dll and plugins relative to exe dir
          "[Paths]`r`nPrefix=.`r`nPlugins=." | Set-Content -Path (Join-Path $pkg "qt.conf") -Encoding Ascii

          # Bundle app-local MSVC x64 CRT DLLs so TeamTalkExtro runs even without VC++ Redist
          $crtDirs = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC" -Directory -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending
          foreach ($d in $crtDirs) {
              $crt = Join-Path $d.FullName "x64\Microsoft.VC143.CRT"
              if (Test-Path $crt) {
                  Copy-Item (Join-Path $crt "*.dll") $pkg -Force
                  Write-Host "Copied MSVC x64 CRT DLLs from $crt"
                  break
              }
          }

          if (-not (Test-Path (Join-Path $pkg "TeamTalkExtro.exe"))) { throw "TeamTalkExtro.exe missing from package" }
          if (-not (Test-Path (Join-Path $pkg "TeamTalk5.dll"))) { throw "TeamTalk5.dll missing from package" }
          Get-ChildItem $pkg | Format-Table Name, Length

      - name: Version and portable zip
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.TrimStart('v') } else { $env:EXTRO_VERSION }
          "EXTRO_RELEASE_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $dist = Join-Path $env:RUNNER_WORKSPACE "dist"
          Compress-Archive -Path (Join-Path $dist "TeamTalkExtro\*") -DestinationPath (Join-Path $dist "TeamTalkExtro-$ver-win64-portable.zip") -Force

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $src = Join-Path $env:RUNNER_WORKSPACE "dist\TeamTalkExtro"
          & $iscc "/DExtroVersion=$env:EXTRO_RELEASE_VERSION" "/DSrcDir=$src" "$env:GITHUB_WORKSPACE\Setup\Extro\TeamTalkExtro.iss"
          Copy-Item "$env:GITHUB_WORKSPACE\Setup\Extro\Output\*.exe" (Join-Path $env:RUNNER_WORKSPACE "dist") -Force

      - name: Archive source
        shell: pwsh
        run: |
          git archive --format=zip --output="$env:RUNNER_WORKSPACE\dist\TeamTalkExtro-$env:EXTRO_RELEASE_VERSION-source.zip" HEAD

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TeamTalkExtro-Windows
          path: |
            ${{runner.workspace}}/dist/TeamTalkExtro-*-win64-portable.zip
            ${{runner.workspace}}/dist/TeamTalkExtro-*-win64-setup.exe
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.EXTRO_VERSION) }}
          name: TeamTalk Extro ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.EXTRO_VERSION) }}
          body: |
            ## TeamTalk Extro Windows ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.EXTRO_VERSION) }} — Новые возможности и исправления

            ### 📦 Файлы релиза
            - `TeamTalkExtro-*-win64-setup.exe` — установщик Inno Setup для Windows x64 (с автоустановкой VC++ Redistributable, ассоциацией `.tt` и протокола `tt://`).
            - `TeamTalkExtro-*-win64-portable.zip` — портативная версия (распаковать в любую папку и запустить `TeamTalkExtro.exe`).

            ### 🔧 Исправление запуска установленной версии (`setup.exe`)
            - Добавлены `WorkingDir: "{app}"`, `runasoriginaluser`, `CloseApplications=yes` и корректная установка `vc_redist.x64.exe` в Inno Setup.
            - В дистрибутив добавлены `qt.conf`, app-local MSVC x64 CRT DLL (`vcruntime140.dll`, `msvcp140.dll` и др.), `TeamTalk Extro.ini.default` и файлы локализации `.qm`.
            - В `main.cpp` на Windows добавлена инициализация `SetDllDirectoryW` и `QCoreApplication::addLibraryPath` по папке исполняемого файла.
            - Зарегистрированы ассоциации файлов `.tt` и ссылок `tt://` через `HKA` (работает как при установке от администратора, так и для текущего пользователя).

            ### 🎭 Голосовые эффекты Pro (Voice Changer — 24 режима + Auto-Tune + Studio Rack)
            - 24 режима, совместимых с Android-версией TeamTalk Extro:
              - Классические: `Off`, `Echo / Reverb`, `Deep Voice`, `Chipmunk`, `Robot`, `Radio`, `Megaphone`, `Monster`, `Alien`, `Underwater`, `Chorus`, `Telephone`, `Ghost`.
              - Новые: **Auto-Tune (Pop / Chromatic)**, **Auto-Tune Hard (T-Pain)**, **Studio Voice Rack** (Noise Gate + RMS Compressor + Warm EQ), **Concert Hall**, **Demon**, **Helium**, **Female Voice**, **Male Baritone**, **Walkie-Talkie**, **Whisper / ASMR**, **Broadcast DJ**.
            - Реальный детектор основного тона F0 (80–700 Гц) и выбор музыкального лада Auto-Tune (`Chromatic`, `Major`, `Minor`).
            - Диалог настройки `Voice Changer -> Echo / Reverb / Auto-Tune Settings...`.

            ### 🎤 Караоке Pro + Soundboard + Auto-Ducking + WASAPI Loopback
            - **Захват системного звука / браузера (WASAPI Loopback)** (`Karaoke -> Start System/Browser Audio`): трансляция YouTube, браузера, RadioBOSS и любых приложений Windows прямо в канал без VB-Cable и без эха в колонки!
            - **Пауза / Продолжить** (`Ctrl+Shift+P`), **Стоп** (`Ctrl+Shift+S`), регулировка громкости минусовки.
            - **Auto-Ducking**: автоматическое мягкое приглушение минусовки во время пения/речи (~0.48x) с плавным возвратом.
            - **Смена тональности (Pitch / Key Shift)**: от `-6` до `+6` полутонов без изменения темпа.
            - **Встроенный Soundboard / Джингл-машина** (`Ctrl+Alt+1..6`): Аплодисменты, Барабанная дробь (Ba-dum-tss), Фанфары, DJ Airhorn, Колокольчик, Баззер + воспроизведение любых своих аудиофайлов-джинглов.
            - **Авто-статус** при запуске караоке (`🎤 Пою: <трек>`).

            ### 🌐 Пинг серверов и Server Peek («Кто на сервере без входа в канал»)
            - Новая колонка **Ping** в списке серверов + кнопки **Ping Selected** и **Ping All** (асинхронный TCP RTT).
            - **Who's Online (Peek)...**: просмотр списка каналов и подключённых пользователей на сервере без входа в канал, с кнопками «Подключиться» и «Обновить».

            ### 💾 Единый кроссплатформенный бэкап (JSON) и проверка обновлений
            - Экспорт и импорт серверов и настроек TeamTalk Extro в едином формате JSON, полностью совместимом с **TeamTalk Extro для Android** (`Client -> Export/Import Settings & Servers Backup (JSON)...` и в окне серверов).
            - Проверка обновлений напрямую через GitHub Releases (`Help -> Check for TeamTalk Extro Updates...`).

            ---
            *Благодарности (Credits): основано на [BearWare/TeamTalk5](https://github.com/BearWare/TeamTalk5) и [nekit-wq/Teamtalk-next](https://github.com/nekit-wq/Teamtalk-next).*
          files: |
            ${{runner.workspace}}/dist/TeamTalkExtro-*-win64-portable.zip
            ${{runner.workspace}}/dist/TeamTalkExtro-*-win64-setup.exe
            ${{runner.workspace}}/dist/TeamTalkExtro-*-source.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

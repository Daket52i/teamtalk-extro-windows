name: TeamTalk Extro Windows

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  EXTRO_VERSION: "1.0.0"
  QT_VERSION: "6.12.0"

jobs:
  build:
    name: Build Windows client
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: 'qtmultimedia qtspeech'
          cache: true

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install MSYS2 (base-devel)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: base-devel

      - name: Install NASM
        run: |
          $url = "https://www.nasm.us/pub/nasm/releasebuilds/3.01/win64/nasm-3.01-win64.zip"
          Invoke-WebRequest -Uri $url -OutFile nasm.zip
          Expand-Archive -Path nasm.zip -DestinationPath nasm -Force
          $nasmDir = (Get-ChildItem nasm -Directory | Select-Object -First 1).FullName
          echo "$nasmDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure CMake
        shell: cmd
        run: |
          cmake -S . -B output -A x64 ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DFEATURE_WEBRTC=OFF ^
            -DBUILD_TEAMTALK_LIBRARY_UNITTEST_CATCH2=OFF ^
            -DTOOLCHAIN_INSTALL_PREFIX=%GITHUB_WORKSPACE%\install-toolchain ^
            -DCMAKE_INSTALL_PREFIX=%GITHUB_WORKSPACE%\install-teamtalk ^
            -DCMAKE_PREFIX_PATH=%Qt6_DIR%

      - name: Build and install
        shell: cmd
        run: cmake --build output --parallel --config Release --target install

      - name: Assemble portable folder
        shell: pwsh
        run: |
          $pkg = "dist\TeamTalkExtro"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null

          Copy-Item "install-teamtalk\Client\qtTeamTalk\*" $pkg -Recurse -Force
          Copy-Item "install-teamtalk\Library\TeamTalk_DLL\TeamTalk5.dll" $pkg -Force

          # Default configuration file shipped with the portable build
          Copy-Item "Setup\Client\Windows\TeamTalk5.ini" "$pkg\TeamTalkExtro.ini.default" -Force

          # Sounds used by the client
          Copy-Item "Setup\Client\Sounds" "$pkg\Sounds" -Recurse -Force

          Write-Host "Contents of $pkg :"
          Get-ChildItem $pkg | Format-Table Name, Length

      - name: Run windeployqt
        shell: pwsh
        run: |
          $pkg = "dist\TeamTalkExtro"
          windeployqt --release --no-translations --compiler-runtime "$pkg\TeamTalkExtro.exe"

      - name: Zip portable build
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.TrimStart('v') } else { $env:EXTRO_VERSION }
          "EXTRO_RELEASE_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Compress-Archive -Path "dist\TeamTalkExtro\*" -DestinationPath "dist\TeamTalkExtro-$ver-win64-portable.zip" -Force

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DExtroVersion=$env:EXTRO_RELEASE_VERSION" "/DSrcDir=$env:GITHUB_WORKSPACE\dist\TeamTalkExtro" "Setup\Extro\TeamTalkExtro.iss"
          Copy-Item "Setup\Extro\Output\*.exe" "dist\" -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TeamTalkExtro-Windows
          path: |
            dist/TeamTalkExtro-*-win64-portable.zip
            dist/TeamTalkExtro-*-win64-setup.exe
          if-no-files-found: error

      - name: Archive source
        shell: pwsh
        run: |
          git archive --format=zip --output="dist/TeamTalkExtro-$env:EXTRO_RELEASE_VERSION-source.zip" HEAD

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.EXTRO_VERSION) }}
          name: TeamTalk Extro ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.EXTRO_VERSION) }}
          body: |
            Windows client build of TeamTalk Extro.

            - `TeamTalkExtro-*-win64-portable.zip` — unpack anywhere and run `TeamTalkExtro.exe`.
            - `TeamTalkExtro-*-win64-setup.exe` — Inno Setup installer.
          files: |
            dist/TeamTalkExtro-*-win64-portable.zip
            dist/TeamTalkExtro-*-win64-setup.exe
            dist/TeamTalkExtro-*-source.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
